<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Mess&Anger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(217, 118, 14, 0.08) 0%, transparent 60%);
    }
    .container { max-width: 380px; }
    .icon { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 50%; background: rgba(217, 118, 14, 0.1); display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 32px; height: 32px; color: #d9760e; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
    p { color: #8a9cb8; line-height: 1.6; margin-bottom: 8px; font-size: 14px; }
    .note { color: #5a6b82; font-size: 12px; margin-bottom: 32px; }
    .retry-btn {
      background: linear-gradient(135deg, #d9760e, #f59e0b);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      min-width: 200px;
      min-height: 48px;
    }
    .retry-btn:active { transform: scale(0.97); }
    .retry-btn:hover { box-shadow: 0 4px 20px rgba(217, 118, 14, 0.3); }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </div>
    <h1>No Connection</h1>
    <p>You're offline. Your encrypted messages are safely stored locally and will sync automatically when connection is restored.</p>
    <p class="note"><span class="status-dot"></span>All data is encrypted at rest and protected</p>
    <button class="retry-btn" id="retry-btn" type="button">Try Again</button>
  </div>
  <script>
    document.getElementById('retry-btn').addEventListener('click', function(){ location.reload(); });
  </script>
</body>
</html>
