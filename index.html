<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Mess&Anger — Secure P2P Messenger</title>
    <meta name="description" content="End-to-end encrypted P2P messenger with X25519 + Ed25519 + HMAC. No server, no phone required." />

    <!-- Security headers. The complete set lives in public/_headers (Netlify syntax);
         on the nginx deployment those are ignored, so CSP + Referrer-Policy are also
         declared here via <meta>. Server-level headers (HSTS, X-Frame-Options,
         X-Content-Type-Options, Permissions-Policy) must be set in the nginx config. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Apple/iOS specific meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mess&Anger" />
    <meta name="apple-touch-icon" content="/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
    
    <!-- iOS-specific: prevent text size changes -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Android specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/webp" href="/icons/favicon.webp" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
  
 
  </head>
  <body>
    <a href="#main-content" class="skip-to-content" style="position:absolute;left:-9999px;top:0;z-index:9999;padding:12px 24px;background:#f97316;color:#fff;font-size:14px;font-weight:700;border-radius:0 0 8px 0;text-decoration:none;transform:translateY(-100%);transition:transform 0.2s">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/skip-to-content.js" defer></script>
  </body>
</html>
