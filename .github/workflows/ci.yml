name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install admin dependencies
        run: npm ci --prefix admin
      - run: npm run lint
      # The admin SPA has its own tsconfig (strict + noUncheckedIndexedAccess)
      # and is excluded from the root type-check, so it needs its own gate.
      - name: Type-check the admin SPA
        run: npm run lint:admin
      - run: npx vitest run
      - run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
