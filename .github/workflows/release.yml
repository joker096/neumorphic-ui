name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
          - os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Build bundles
        run: npx tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: Pre-generate MSI WiX sources (expected candle failure on `&` — see AGENTS.md)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx tauri build --bundles msi --target x86_64-pc-windows-msvc; $exit = $LASTEXITCODE
          if ($exit -eq 0) { Write-Error 'Expected MSI candle failure but build succeeded unexpectedly' }
          Write-Host "Expected MSI build exit code: $exit (WiX source generated, candle failed)"

      - name: Build MSI via patched WiX pipeline
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/build-windows-msi.mjs

      - name: Generate release manifest
        shell: pwsh
        run: node scripts/release.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/releases/
            !dist/releases/**/*.asc