name: Deploy Admin to GitHub Pages
on:
  push:
    branches:
      - master
    paths:
      - admin/**
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & build
        working-directory: ./admin
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'http://localhost:8766' }}
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Deploy
        run: |
          mkdir -p /tmp/admin-dist
          cp -r admin/dist/. /tmp/admin-dist/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin gh-pages --depth=1 || true
          git checkout --orphan gh-pages-temp
           rm -f ./*.html ./*.ts ./*.tsx ./*.json ./*.mjs 2>/dev/null || true
          rm -rf assets/ src/ public/ admin/ server/ config/ data/ docs/ scripts/ 2>/dev/null || true
          cp -r /tmp/admin-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "[skip ci] Deploy admin panel" || true
          git push -f origin gh-pages-temp:gh-pages
