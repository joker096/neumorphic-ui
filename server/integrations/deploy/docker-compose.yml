version: "3.8"

# Integration Hub deployment (ACTION_PLAN item 7, blueprint §20).
# Run `docker compose up` after building the server image.
# Requires enabling PostgresStore + BullQueue (ACTION_PLAN item 3) and
# running server/integrations/migrations/001_init.sql against `postgres`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: messanger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: messanger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messanger"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  integrations:
    build:
      context: ../../..
      dockerfile: server/integrations/deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://messanger:${DB_PASSWORD:-changeme}@postgres:5432/messanger
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
