# mess.cvr.name — nginx site config (corrected)
# REST API (incl. /api/admin/* and /admin UI) is served by signaling-server.ts on REST_PORT=3003
# WebSocket signaling is on PORT=3006. Keep both in sync with the running process env.
#
# Rate limiting happens in TWO layers (defence in depth):
#   * here, keyed on $binary_remote_addr — always the real client address;
#   * in Node (routes/auth.ts, signaling-server.ts) keyed on the proxy-aware
#     client IP from middleware/clientIp.ts.
# The Node limits alone are not enough: they live in process memory, so they
# reset on deploy and do not span instances.

limit_req_zone $binary_remote_addr zone=mess_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=mess_auth:10m rate=30r/m;

server {
    listen 80;
    server_name mess.cvr.name www.mess.cvr.name;
    return 301 https://mess.cvr.name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mess.cvr.name;
    root /var/www/mess.cvr.name;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/mess.cvr.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mess.cvr.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Vary "Accept-Encoding" always;

    # ── Compression ──────────────────────────────────────────────────
    # Build-time compression (vite-plugin-compression) emits *.gz + *.br
    # beside every asset. gzip_static serves those verbatim (0 CPU, Vary
    # handled above); brotli requires ngx_http_brotli_static (not installed)
    # so the *.br files are simply ignored by nginx. The node REST server
    # (serveAdminFile) already prefers *.br for /admin.
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/css
        application/json
        image/svg+xml
        application/manifest+json
        text/plain;
    gzip_disable "msie6";

    # ── Service workers ──────────────────────────────────────────────
    location = /sw.js {
        alias /var/www/mess.cvr.name/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /service-worker.js {
        alias /var/www/mess.cvr.name/service-worker.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /registerSW.js {
        alias /var/www/mess.cvr.name/registerSW.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Health check → REST server (REST_PORT=3003) ──────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── WebSocket Signaling (PORT=3006) ──────────────────────────────
    location = /ws {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Without these the Node side sees only 127.0.0.1 and its per-IP
        # connection limit becomes a single global bucket for all users.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── Auth endpoints: tighter bucket (brute-force / 2FA lockout) ─────
    location ^~ /api/auth/ {
        limit_req zone=mess_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── REST API (REST_PORT=3003) ────────────────────────────────────
    # Serves /api/auth, /api/stats, /api/ads, /api/paymento/ipn AND /health.
    location /api/ {
        limit_req zone=mess_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin UI (served by REST server via serveAdminFile, REST_PORT=3003) ──
    # The admin SPA is deployed to $AppRoot/dist/admin. Paths must NOT fall
    # through to the PHP try_files block (rings a 502 since php8.2 was removed;
    # the live pool is php8.3-fpm-mess.cvr.name.sock).
    location = /admin {
        proxy_pass http://127.0.0.1:3003;
    }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3003;
    }

    # ── Promo redirects ──────────────────────────────────────────────
    location = /promo {
        return 301 /landing/;
    }
    location ^~ /promo/ {
        return 301 /landing/;
    }

    # ── SPA / frontend ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm-mess.cvr.name.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

server {
    listen 443 ssl;
    server_name www.mess.cvr.name;
    ssl_certificate /etc/letsencrypt/live/mess.cvr.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mess.cvr.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://mess.cvr.name$request_uri;
}
