# mess.cvr.name — nginx site config (corrected)
# REST API (incl. /api/paymento/ipn) is served by signaling-server.ts on REST_PORT=3003
# WebSocket signaling is on PORT=3006. Keep both in sync with the running process env.

server {
    listen 80;
    server_name mess.cvr.name www.mess.cvr.name;
    return 301 https://mess.cvr.name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mess.cvr.name;
    root /var/www/mess.cvr.name;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/mess.cvr.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mess.cvr.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Service workers ──────────────────────────────────────────────
    location = /sw.js {
        alias /var/www/mess.cvr.name/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /service-worker.js {
        alias /var/www/mess.cvr.name/service-worker.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /registerSW.js {
        alias /var/www/mess.cvr.name/registerSW.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Health check → REST server (REST_PORT=3003) ──────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── WebSocket Signaling (PORT=3006) ──────────────────────────────
    location = /ws {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ── REST API (REST_PORT=3003) ────────────────────────────────────
    # Serves /api/auth, /api/stats, /api/ads, /api/paymento/ipn AND /health.
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Promo redirects ──────────────────────────────────────────────
    location = /promo {
        return 301 /landing/;
    }
    location ^~ /promo/ {
        return 301 /landing/;
    }

    # ── SPA / frontend ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

server {
    listen 443 ssl;
    server_name www.mess.cvr.name;
    ssl_certificate /etc/letsencrypt/live/mess.cvr.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mess.cvr.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://mess.cvr.name$request_uri;
}
