<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Messages</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg:#f0f2f5; --surface:#fff; --surface2:#f7f8fa;
  --text:#1a1a2e; --sub:#8a8fa8;
  --accent:#f47c3c; --blue:#2979ff;
  --online:#22c55e; --offline:#ef4444;
  --border:#eef0f5;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --r:16px; --tr:all .22s cubic-bezier(.4,0,.2,1);
}
body.dark {
  --bg:#12141c; --surface:#1e2130; --surface2:#252a3a;
  --text:#e8eaf2; --sub:#5a6180;
  --border:#2a2f45;
  --shadow:0 2px 12px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
}

body {
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  transition:var(--tr);
}

.phone {
  width:390px; min-height:844px;
  background:var(--surface); border-radius:48px;
  overflow:hidden;
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(0,0,0,.08);
  position:relative; display:flex; flex-direction:column;
  transition:var(--tr);
}

/* Statusbar */
.statusbar {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 28px 8px; font-size:13px; font-weight:600; color:var(--text); flex-shrink:0;
}
.statusbar-icons { display:flex; gap:6px; align-items:center; }
.statusbar-icons svg { width:16px; height:16px; fill:var(--text); }

/* Header */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 24px 12px; flex-shrink:0;
}
.header-left { display:flex; align-items:center; gap:6px; cursor:pointer; }
.header-left svg { width:18px; height:18px; stroke:var(--blue); fill:none; stroke-width:2; }
.header-back { font-size:16px; color:var(--blue); font-weight:500; }
.header-dots { cursor:pointer; padding:4px; border-radius:50%; }
.header-dots svg { width:20px; height:20px; fill:var(--sub); }

/* Search */
.search-wrap { padding:4px 20px 12px; flex-shrink:0; }
.search-box {
  display:flex; align-items:center; background:var(--surface2);
  border-radius:12px; padding:10px 14px; gap:10px;
}
.search-box svg { width:16px; height:16px; stroke:var(--sub); fill:none; flex-shrink:0; }
.search-box input {
  border:none; background:transparent; font-size:15px; color:var(--text);
  outline:none; width:100%; font-family:inherit;
}
.search-box input::placeholder { color:var(--sub); }

/* Tabs */
.tabs { display:flex; padding:0 20px 12px; gap:8px; flex-shrink:0; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab {
  padding:7px 16px; border-radius:20px; font-size:13px; font-weight:600;
  cursor:pointer; transition:var(--tr); border:1.5px solid var(--border);
  color:var(--sub); background:transparent; white-space:nowrap; flex-shrink:0;
}
.tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* List container */
.list { flex:1; overflow-y:auto; padding:0 16px 20px; scrollbar-width:none; }
.list::-webkit-scrollbar { display:none; }

/* ─── SWIPE ROW SYSTEM ─── */
/* Outer wrapper — clips so the archive button stays inside */
.row-wrap {
  position:relative; margin-bottom:8px;
  border-radius:var(--r); overflow:hidden;
}

/* Archive button — sits behind, right edge, full height */
.archive-btn {
  position:absolute; top:0; right:0; bottom:0;
  width:76px;
  background:var(--accent);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; color:#fff; font-size:11px; font-weight:700;
  cursor:pointer; border-radius:0 var(--r) var(--r) 0;
  transition:var(--tr);
}
.archive-btn svg { width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.8; }

/* Contact card — slides left over the archive button */
.contact-item {
  display:flex; align-items:center; gap:13px;
  padding:12px 12px;
  background:var(--surface);
  border-radius:var(--r);
  cursor:pointer;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  position:relative;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  user-select:none; -webkit-user-select:none;
  z-index:1;
  overflow:hidden; /* clip inline call buttons */
}
.row-wrap.swiped .contact-item { transform:translateX(-76px); }

/* Avatar */
.avatar-wrap { position:relative; flex-shrink:0; }
.avatar {
  width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:18px; overflow:hidden;
}
.status-dot {
  position:absolute; bottom:2px; right:2px;
  width:13px; height:13px; border-radius:50%;
  border:2.5px solid var(--surface);
}
.status-dot.online { background:var(--online); }
.status-dot.offline { background:var(--offline); }

/* Group avatar */
.group-avatar {
  width:52px; height:52px; border-radius:50%;
  background:var(--surface2); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; color:var(--sub);
  border:1px solid var(--border);
}
.group-mini-avatars { display:flex; margin-top:4px; }
.group-mini-avatars .mini {
  width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--surface);
  font-size:7px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  margin-left:-4px;
}
.group-mini-avatars .mini:first-child { margin-left:0; }

/* Info */
.contact-info { flex:1; min-width:0; }
.contact-top { display:flex; justify-content:space-between; align-items:center; }
.contact-name { font-size:15px; font-weight:700; color:var(--text); }
.contact-time { font-size:12px; color:var(--sub); }
.contact-preview {
  font-size:13px; color:var(--sub); margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Unread badge */
.unread-badge {
  background:var(--blue); color:#fff; font-size:11px; font-weight:700;
  border-radius:10px; min-width:20px; height:20px;
  display:flex; align-items:center; justify-content:center;
  padding:0 5px; flex-shrink:0;
}

/* ─── INLINE VOICE/VIDEO BUTTONS ─── */
/* These appear absolutely inside .contact-item on the right side */
.call-inline {
  position:absolute; top:0; right:0; bottom:0;
  display:flex; align-items:center; gap:0;
  pointer-events:none; opacity:0;
  transition:opacity .2s ease;
}
.contact-item.call-visible .call-inline {
  pointer-events:all; opacity:1;
}
.call-inline-btn {
  height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:0 14px;
  font-size:11px; font-weight:700; color:#fff;
  cursor:pointer; border:none; font-family:inherit;
}
.call-inline-btn.voice { background:#2b2f42; border-radius:0; }
.call-inline-btn.video { background:var(--blue); border-radius:0 var(--r) var(--r) 0; }
.call-inline-btn svg { width:18px; height:18px; fill:#fff; }

/* Bottom nav */
.bottom-nav {
  display:flex; padding:10px 24px 28px;
  border-top:1px solid var(--border); background:var(--surface);
  flex-shrink:0; gap:8px;
}
.nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; padding:8px 4px; border-radius:10px;
  transition:var(--tr); color:var(--sub);
}
.nav-item.active { color:var(--accent); }
.nav-item svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; }
.nav-item span { font-size:11px; font-weight:600; }

/* FAB */
.fab {
  position:absolute; bottom:88px; right:20px;
  width:52px; height:52px; background:var(--accent); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 4px 20px rgba(244,124,60,.4);
  transition:var(--tr); z-index:10;
}
.fab:active { transform:scale(.92); }
.fab svg { width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2.2; }

/* Theme toggle */
.theme-toggle {
  position:absolute; top:18px; right:-56px;
  width:44px; height:44px; background:var(--surface); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:var(--shadow-lg); z-index:20;
}
.theme-toggle svg { width:20px; height:20px; stroke:var(--text); fill:none; stroke-width:1.8; }

@media(max-width:480px){
  body { align-items:flex-start; background:var(--surface); }
  .phone { width:100vw; min-height:100vh; border-radius:0; }
  .theme-toggle { position:fixed; bottom:100px; right:16px; top:auto; }
}
</style>
</head>
<body>

<div class="phone" id="phone">

  <div class="theme-toggle" id="themeBtn">
    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
  </div>

  <!-- Statusbar -->
  <div class="statusbar">
    <span>9:41</span>
    <div class="statusbar-icons">
      <svg viewBox="0 0 24 24"><rect x="2" y="8" width="3" height="14" rx="1"/><rect x="7" y="5" width="3" height="17" rx="1"/><rect x="12" y="2" width="3" height="20" rx="1"/><rect x="17" y="0" width="3" height="22" rx="1" opacity=".3"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="11" rx="2"/><path d="M20 10h2v5h-2z" fill-opacity=".5"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span class="header-back">Contacts</span>
    </div>
    <div class="header-dots">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search contacts..." oninput="renderContacts()">
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab(this,'all')">All</div>
    <div class="tab" onclick="switchTab(this,'unread')">Unread</div>
    <div class="tab" onclick="switchTab(this,'groups')">Groups</div>
    <div class="tab" onclick="switchTab(this,'archived')">Archived</div>
  </div>

  <!-- List -->
  <div class="list" id="contactList"></div>

  <!-- FAB -->
  <div class="fab">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="switchNav(this)">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </div>
    <div class="nav-item active" onclick="switchNav(this)">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Messages</span>
    </div>
    <div class="nav-item" onclick="switchNav(this)">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.52 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 8a16 16 0 0 0 5.91 5.91l.72-.72a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span>Calls</span>
    </div>
    <div class="nav-item" onclick="switchNav(this)">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </div>
  </div>

</div>

<script>
const CONTACTS = [
  { id:1,  name:'Johnny Depp',       preview:'Hello !! Ipsum is simply dummy...', time:'Now',      unread:1,  online:true,  group:false, archived:false, initials:'JD', color:'#8b5cf6' },
  { id:2,  name:'Robert Downey',     preview:'Hello !! Ipsum is simply dummy...', time:'09:02 PM', unread:0,  online:true,  group:false, archived:false, initials:'RD', color:'#f59e0b' },
  { id:3,  name:'Chris Hemsworth',   preview:'Hello !! Ipsum is simply dummy...', time:'09:02 PM', unread:0,  online:false, group:false, archived:false, initials:'CH', color:'#10b981' },
  { id:4,  name:'Bradley Cooper',    preview:'Hello !! Ipsum is simply dummy...', time:'09:02 PM', unread:0,  online:true,  group:false, archived:false, initials:'BC', color:'#3b82f6' },
  { id:5,  name:'Group Haha',        preview:'Hello !! Ipsum is simply dummy...', time:'09:02 PM', unread:49, online:false, group:true,  archived:false, members:[{i:'MK',c:'#f59e0b'},{i:'JD',c:'#8b5cf6'},{i:'CH',c:'#10b981'},{i:'RD',c:'#3b82f6'}] },
  { id:6,  name:'Matt Damon',        preview:'Hello !! Ipsum is simply dummy...', time:'09:02 PM', unread:0,  online:false, group:false, archived:false, initials:'MD', color:'#ef4444' },
  { id:7,  name:'Jennifer Lawrence', preview:'Hello !! Ipsum is simply dummy...', time:'09:02 PM', unread:0,  online:true,  group:false, archived:false, initials:'JL', color:'#ec4899' },
  { id:8,  name:'Dwayne Johnson',    preview:'Hello !! Ipsum is simply dummy...', time:'09:02 PM', unread:0,  online:false, group:false, archived:false, initials:'DJ', color:'#14b8a6' },
  { id:9,  name:'Old Chat 1',        preview:'Archived message...',               time:'Yesterday',unread:0,  online:false, group:false, archived:true,  initials:'OC', color:'#6b7280' },
  { id:10, name:'Old Chat 2',        preview:'Another archived...',               time:'Mon',      unread:0,  online:false, group:false, archived:true,  initials:'OC', color:'#6b7280' },
];

let currentTab = 'all';
let swipedId = null;   // row currently swiped open (archive)
let callId   = null;   // row currently showing voice/video
let touchStartX = 0;
let touchStartY = 0;
let touchLocked = null; // 'swipe' | 'scroll' | null

function filtered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = CONTACTS;
  if (currentTab === 'unread')   list = list.filter(c => c.unread > 0);
  else if (currentTab === 'groups')   list = list.filter(c => c.group && !c.archived);
  else if (currentTab === 'archived') list = list.filter(c => c.archived);
  else list = list.filter(c => !c.archived);
  if (q) list = list.filter(c => c.name.toLowerCase().includes(q));
  return list;
}

function avatarHTML(c) {
  if (c.group) {
    const label = c.unread > 0 ? '+'+Math.min(c.unread,49) : (c.initials||'G');
    const minis = (c.members||[]).map(m =>
      `<div class="mini" style="background:${m.c}25;color:${m.c}">${m.i[0]}</div>`).join('');
    return `<div style="flex-shrink:0">
      <div class="group-avatar">${label}</div>
      <div class="group-mini-avatars">${minis}</div>
    </div>`;
  }
  return `<div class="avatar-wrap">
    <div class="avatar" style="background:${c.color}22;color:${c.color}">${c.initials}</div>
    <div class="status-dot ${c.online?'online':'offline'}"></div>
  </div>`;
}

function renderContacts() {
  const list = filtered();
  const el = document.getElementById('contactList');
  if (!list.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--sub);font-size:14px">No contacts found</div>`;
    return;
  }
  el.innerHTML = list.map(c => {
    const badge = (!c.group && c.unread > 0)
      ? `<div class="unread-badge">${c.unread > 99 ? '99+' : c.unread}</div>` : '';

    // inline call buttons (voice + video) — always present, toggled via class
    const callBtns = (!c.group) ? `
      <div class="call-inline">
        <button class="call-inline-btn voice" onclick="doCall(event,'voice',${c.id})">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.52 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 8a16 16 0 0 0 5.91 5.91l.72-.72a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Voice
        </button>
        <button class="call-inline-btn video" onclick="doCall(event,'video',${c.id})">
          <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Video
        </button>
      </div>` : '';

    return `
    <div class="row-wrap" id="rw-${c.id}">
      <div class="archive-btn" onclick="archiveContact(event,${c.id})">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        Archive
      </div>
      <div class="contact-item" id="ci-${c.id}"
        ontouchstart="onTS(event,${c.id})"
        ontouchmove="onTM(event,${c.id})"
        ontouchend="onTE(event,${c.id})">
        ${avatarHTML(c)}
        <div class="contact-info">
          <div class="contact-top">
            <span class="contact-name">${c.name}</span>
            <span class="contact-time">${c.time}</span>
          </div>
          <div class="contact-preview">${c.preview}</div>
        </div>
        ${badge}
        ${callBtns}
      </div>
    </div>`;
  }).join('');
}

/* ── close all open states ── */
function closeAll(exceptSwipe, exceptCall) {
  if (swipedId && swipedId !== exceptSwipe) {
    document.getElementById('rw-'+swipedId)?.classList.remove('swiped');
    swipedId = null;
  }
  if (callId && callId !== exceptCall) {
    document.getElementById('ci-'+callId)?.classList.remove('call-visible');
    callId = null;
  }
}

/* ── tap on row ── */
function handleTap(e, id) {
  if (e.target.closest('.call-inline-btn')) return; // handled by doCall
  if (swipedId === id) { closeAll(); return; }
  if (swipedId) { closeAll(); return; }

  // toggle call buttons
  const ci = document.getElementById('ci-'+id);
  const c = CONTACTS.find(x=>x.id===id);
  if (c && c.group) return;
  if (callId === id) {
    ci.classList.remove('call-visible');
    callId = null;
  } else {
    closeAll(null, id);
    ci.classList.add('call-visible');
    callId = id;
  }
}

function doCall(e, type, id) {
  e.stopPropagation();
  const c = CONTACTS.find(x=>x.id===id);
  alert((type === 'voice' ? '📞 Voice' : '📹 Video') + ' call: ' + c.name);
}

function archiveContact(e, id) {
  e.stopPropagation();
  const c = CONTACTS.find(x=>x.id===id);
  if (c) c.archived = !c.archived;
  swipedId = null;
  renderContacts();
}

/* ── mouse swipe (desktop) ── */
let mouseDown = false, mouseStartX = 0, mouseDragId = null;
document.addEventListener('mousedown', e => {
  const ci = e.target.closest('.contact-item');
  if (!ci) return;
  mouseDown = true;
  mouseStartX = e.clientX;
  mouseDragId = parseInt(ci.id.replace('ci-', ''));
  // prevent text selection during drag
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!mouseDown || !mouseDragId) return;
  const dx = e.clientX - mouseStartX;
  const rw = document.getElementById('rw-' + mouseDragId);
  if (!rw) return;
  // live visual feedback while dragging
  const clamp = Math.max(-76, Math.min(0, dx));
  rw.querySelector('.contact-item').style.transition = 'none';
  rw.querySelector('.contact-item').style.transform = `translateX(${clamp}px)`;
});
document.addEventListener('mouseup', e => {
  if (!mouseDown || !mouseDragId) { mouseDown = false; mouseDragId = null; return; }
  const dx = e.clientX - mouseStartX;
  const id = mouseDragId;
  const ci = document.getElementById('ci-' + id);
  const rw = document.getElementById('rw-' + id);
  if (ci) ci.style.transition = '';
  if (Math.abs(dx) > 8) {
    // it was a drag, not a click
    if (dx < -40) {
      closeAll(id);
      rw?.classList.add('swiped');
      if (ci) ci.style.transform = '';
      swipedId = id;
    } else {
      rw?.classList.remove('swiped');
      if (ci) ci.style.transform = '';
      if (swipedId === id) swipedId = null;
    }
  } else {
    // treat as click
    if (ci) ci.style.transform = '';
    handleTap(e, id);
  }
  mouseDown = false; mouseDragId = null;
});

/* ── touch swipe ── */
function onTS(e, id) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchLocked = null;
}
function onTM(e, id) {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!touchLocked) {
    touchLocked = Math.abs(dx) > Math.abs(dy) ? 'swipe' : 'scroll';
  }
  if (touchLocked !== 'swipe') return;
  e.preventDefault();
  if (dx < -30) {
    closeAll(id);
    document.getElementById('rw-'+id)?.classList.add('swiped');
    swipedId = id;
  } else if (dx > 15) {
    document.getElementById('rw-'+id)?.classList.remove('swiped');
    if (swipedId === id) swipedId = null;
  }
}
function onTE(e, id) { touchLocked = null; }

/* ── close on outside click ── */
document.addEventListener('click', e => {
  if (!e.target.closest('.row-wrap') && !e.target.closest('.contact-item')) {
    closeAll();
  }
});

function switchTab(el, tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  swipedId = null; callId = null;
  renderContacts();
}
function switchNav(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

/* ── dark mode ── */
document.getElementById('themeBtn').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const icon = document.getElementById('themeIcon');
  icon.innerHTML = document.body.classList.contains('dark')
    ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    : '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>';
});

renderContacts();
</script>
